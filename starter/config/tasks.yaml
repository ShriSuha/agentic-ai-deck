answer_question:
  description: >
    Answer this question: {question}
    Search the model cards, then open the matching card and read it.
    Answer in a few sentences, using only what that file says.
    Name the file you used.
    If the cards do not contain the answer, say so. Do not guess.
  expected_output: >
    A short answer, the filename of the card you used, or a clear statement
    that the collection does not contain the answer.
  agent: card_guide
  guardrail_max_retries: 3
